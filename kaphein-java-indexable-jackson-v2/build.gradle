plugins {
  id 'java-library'
  id 'maven-publish'
}

apply from: "$rootDir/scripts/publish-maven.gradle"
apply from: 'publish.gradle'

version = ext['PUBLISH_VERSION']
description = ext['PUBLISH_DESCRIPTION']

java {
  sourceCompatibility = JavaVersion.VERSION_1_8
  targetCompatibility = JavaVersion.VERSION_1_8

  withSourcesJar()
  withJavadocJar()
}

repositories {
  mavenLocal()
  mavenCentral()
}

dependencies {
  api project(':kaphein-java-indexable-core')

  api 'com.fasterxml.jackson.core:jackson-databind:2.20.2'

	testCompileOnly 'org.projectlombok:lombok:1.18.40'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.40'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.hamcrest:hamcrest:2.2'
  testImplementation 'org.apache.commons:commons-lang3:3.20.0'
}

tasks.withType(JavaCompile) {
  options.encoding = 'UTF-8'
}

jar {
  enabled = true
}
